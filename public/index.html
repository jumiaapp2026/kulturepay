<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Pesa STK Batch Runner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 14px 0 6px; font-size: 0.9rem; color: #cbd5e1; }
    textarea, input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #10b981;
      color: #06281e;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    #log {
      margin-top: 20px;
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      border: 1px solid #334155;
    }
    .entry { padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .sent { color: #34d399; }
    .error, .invalid { color: #f87171; }
    .sending { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>M-Pesa STK Push Runner (4s Interval)</h1>

    <label for="numbers">Mobile Numbers (one per line or comma-separated)</label>
    <textarea id="numbers" rows="6" placeholder="0712345678&#10;254798765432&#10;+254110000000"></textarea>

    <div class="row">
      <div>
        <label for="amount">Amount (KES)</label>
        <input type="number" id="amount" value="10" min="1" />
      </div>
      <div>
        <label for="reference">Account Reference</label>
        <input type="text" id="reference" value="INVOICE" />
      </div>
    </div>

    <label for="password">Admin Password (if configured on Render)</label>
    <input type="password" id="password" placeholder="Optional dashboard password" />

    <button id="startBtn">Start Sending STK Pushes</button>

    <div id="log"><div class="entry">Ready. Enter numbers above and click Start.</div></div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const logBox = document.getElementById("log");

    function appendLog(text, cls = "") {
      const div = document.createElement("div");
      div.className = `entry ${cls}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      logBox.prepend(div);
    }

    startBtn.addEventListener("click", async () => {
      const rawText = document.getElementById("numbers").value;
      const numbers = rawText.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      const amount = document.getElementById("amount").value;
      const reference = document.getElementById("reference").value;
      const password = document.getElementById("password").value;

      if (!numbers.length) {
        appendLog("Please enter at least one phone number.", "error");
        return;
      }

      startBtn.disabled = true;
      logBox.innerHTML = "";
      appendLog(`Starting batch for ${numbers.length} number(s) at 4s intervals...`);

      try {
        const response = await fetch("/api/batch-stk", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": password
          },
          body: JSON.stringify({ numbers, amount, reference, intervalSeconds: 4 })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Request failed");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");

          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const dataLines = part
              .split("\n")
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.replace(/^data:\s?/, ""));

            if (dataLines.length === 0) continue;

            const event = JSON.parse(dataLines.join("\n"));
            if (event.done) {
              appendLog("Batch completed.", "sent");
            } else {
              appendLog(
                `(${event.index}/${event.total}) ${event.phone}: ${event.message}`,
                event.status
              );
            }
          }
        }
      } catch (err) {
        appendLog(`Error: ${err.message}`, "error");
      } finally {
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
